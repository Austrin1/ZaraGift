<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zara üçün Xüsusi Məktub 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
            border: 2px solid #ffb6c1;
            backdrop-filter: blur(5px);
        }
        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            min-height: 50px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn-yes {
            background-color: #ff4757;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }
        .btn-yes:hover {
            transform: scale(1.1);
            background-color: #ff6b81;
        }
        .btn-no {
            background-color: #ced6e0;
            color: #2f3542;
            position: absolute;
            right: 20px;
        }
        .success-message {
            display: none;
            margin-top: 20px;
            color: #d63384;
            font-weight: bold;
            font-size: 18px;
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .heart {
            position: absolute;
            font-size: 20px;
            color: #ff6b81;
            animation: float 4s linear infinite;
            opacity: 0.7;
            user-select: none;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Zara, məni bağışlayarsan? 🥺🌸</h1>
        <p>
            Sənə qarşı etdiyim səhvə görə həqiqətən çox peşmanam sonuncu insansanki xetrive deymek istiyim bagislamaq veya bagislamamaq sene qalib bagislamagin umidi ile ✌️
        </p>
        
        <div class="buttons">
            <button class="btn btn-yes" onclick="forgive()">Bəli, bağışlayıram! 💕</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">Xeyr 🙈</button>
        </div>

        <div class="success-message" id="successMsg">
            🎉 
        </div>
    </div>

    <script>
        // Arxa fonda uçuşan ürəklər
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '🌸';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }
        setInterval(createHeart, 300);

        // "Xeyr" düyməsinin qaçması
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // "Bəli" kliklənəndə
        function forgive() {
            document.getElementById('successMsg').style.display = 'block';
            document.querySelector('.buttons').style.display = 'none';

            // Ekranı ürək yağışına tutmaq
            for(let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 40);
            }
        }
    </script>
</body>
</html>
